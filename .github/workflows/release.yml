
name: Compilar e publicar PDV

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ==========================================
  # WINDOWS
  # ==========================================

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Atualizar versão pelo número da Release
        run: |
          python -c "import json, os; p='version.json'; d=json.load(open(p, encoding='utf-8')); d['version']=os.environ['GITHUB_REF_NAME'].removeprefix('v'); open(p,'w',encoding='utf-8').write(json.dumps(d,indent=4,ensure_ascii=False)+'\n')"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Windows
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name PDV-Mercadinho main.py

      # IMPORTANTE:
      # O version.json precisa ficar ao lado do EXE.
      - name: Copiar arquivo de versão
        run: |
          Copy-Item version.json dist/PDV-Mercadinho/version.json

      - name: Compactar
        run: |
          Compress-Archive -Path dist/PDV-Mercadinho -DestinationPath PDV-Mercadinho-Windows.zip

      - name: Salvar executável
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: PDV-Mercadinho-Windows.zip


  # ==========================================
  # LINUX APPIMAGE
  # ==========================================

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Atualizar versão pelo número da Release
        run: |
          python -c "import json, os; p='version.json'; d=json.load(open(p, encoding='utf-8')); d['version']=os.environ['GITHUB_REF_NAME'].removeprefix('v'); open(p,'w',encoding='utf-8').write(json.dumps(d,indent=4,ensure_ascii=False)+'\n')"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk wget
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Linux
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name PDV-Mercadinho main.py

      - name: Preparar AppImage
        run: |
          mkdir -p AppDir/usr/bin

          cp -r dist/PDV-Mercadinho AppDir/usr/bin/

          cp assets/pdv-mercadinho.png AppDir/pdv-mercadinho.png
          cp assets/pdv-mercadinho.png AppDir/.DirIcon

          cp version.json AppDir/usr/bin/PDV-Mercadinho/version.json

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          cd "$HERE/usr/bin/PDV-Mercadinho"
          exec ./PDV-Mercadinho "$@"
          EOF

          chmod +x AppDir/AppRun

          cat > AppDir/pdv-mercadinho.desktop <<'EOF'
          [Desktop Entry]
          Name=PDV Mercadinho
          Exec=AppRun
          Icon=pdv-mercadinho
          Type=Application
          Categories=Office;
          Terminal=false
          EOF

      - name: Baixar ferramenta AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Gerar AppImage
        run: |
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir dist/PDV-Mercadinho-Linux.AppImage

      - name: Salvar AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/PDV-Mercadinho-Linux.AppImage


  # ==========================================
  # PUBLICAR RELEASE
  # ==========================================

  publish:
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux

    steps:
      - name: Baixar arquivos Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Baixar arquivos Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/PDV-Mercadinho-Windows.zip
            release-assets/PDV-Mercadinho-Linux.AppImage
          generate_release_notes: true
          make_latest: true
