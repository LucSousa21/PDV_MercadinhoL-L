
name: Compilar e publicar PDV

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ==========================================
  # WINDOWS
  # ==========================================

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Atualizar versão pelo número da Release
        shell: pwsh
        run: |
          $versao = $env:GITHUB_REF_NAME -replace '^v', ''

          $dados = Get-Content version.json -Raw | ConvertFrom-Json
          $dados.version = $versao

          $dados | ConvertTo-Json -Depth 10 |
            Set-Content version.json -Encoding utf8

          Write-Host "Versão da compilação: $versao"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Windows
        run: |
          pyinstaller --noconfirm --clean PDV-Mercadinho.spec

      - name: Validar compilação Windows
        shell: pwsh
        run: |
          $diretorio = "dist/PDV-Mercadinho"

          Write-Host "===== VALIDANDO ESTRUTURA WINDOWS ====="

          if (!(Test-Path $diretorio -PathType Container)) {
              throw "Diretório de distribuição não encontrado!"
          }

          Write-Host "===== VALIDANDO EXECUTÁVEL ====="

          if (!(Test-Path "$diretorio/PDV-Mercadinho.exe" -PathType Leaf)) {
              Get-ChildItem $diretorio -Recurse
              throw "Executável Windows não encontrado!"
          }

          Write-Host "Executável encontrado."

          Write-Host "===== VALIDANDO VERSION.JSON ====="

          if (!(Test-Path "$diretorio/version.json" -PathType Leaf)) {
              throw "version.json não encontrado!"
          }

          Write-Host "version.json encontrado."

          Write-Host "===== VALIDANDO DEPENDÊNCIAS ====="

          if (!(Test-Path "$diretorio/_internal" -PathType Container)) {
              throw "Pasta _internal não encontrada!"
          }

          Write-Host "Dependências encontradas."

          Write-Host "Compilação Windows validada com sucesso!"

      - name: Inspecionar arquivos Windows
        shell: pwsh
        run: |
          Write-Host "===== ESTRUTURA GERADA ====="
          Get-ChildItem dist -Recurse

      - name: Compactar Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/PDV-Mercadinho" `
            -DestinationPath "PDV-Mercadinho-Windows.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Validar ZIP Windows
        shell: pwsh
        run: |
          $zip = "PDV-Mercadinho-Windows.zip"

          if (!(Test-Path $zip)) {
              throw "ZIP Windows não foi gerado!"
          }

          if ((Get-Item $zip).Length -eq 0) {
              throw "ZIP Windows está vazio!"
          }

          Write-Host "ZIP Windows gerado com sucesso."

      - name: Salvar pacote Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: PDV-Mercadinho-Windows.zip
          if-no-files-found: error


  # ==========================================
  # LINUX APPIMAGE
  # ==========================================

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Atualizar versão pelo número da Release
        run: |
          python -c "import json, os; p='version.json'; d=json.load(open(p, encoding='utf-8')); d['version']=os.environ['GITHUB_REF_NAME'].removeprefix('v'); open(p,'w',encoding='utf-8').write(json.dumps(d,indent=4,ensure_ascii=False)+'\n')"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk wget

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Linux
        run: |
          pyinstaller --noconfirm --clean PDV-Mercadinho.spec

      - name: Inspecionar arquivos Linux
        run: |
          echo "===== ESTRUTURA GERADA PELO PYINSTALLER ====="
          find dist -maxdepth 5 -print

          echo "===== PERMISSÕES DO EXECUTÁVEL ====="
          ls -lah dist/PDV-Mercadinho/ || true

      - name: Validar compilação Linux
        shell: bash
        run: |
          DIRETORIO="dist/PDV-Mercadinho"

          echo "===== VALIDANDO ESTRUTURA LINUX ====="

          if [ ! -d "$DIRETORIO" ]; then
            echo "ERRO: Diretório de distribuição não encontrado!"
            find dist -maxdepth 5 -print || true
            exit 1
          fi

          echo "===== VALIDANDO EXECUTÁVEL ====="

          if [ ! -f "$DIRETORIO/PDV-Mercadinho" ]; then
            echo "ERRO: Executável Linux não encontrado!"
            ls -lah "$DIRETORIO"
            exit 1
          fi

          if [ ! -x "$DIRETORIO/PDV-Mercadinho" ]; then
            echo "ERRO: Executável sem permissão de execução!"
            exit 1
          fi

          echo "Executável encontrado."

          echo "===== VALIDANDO VERSION.JSON ====="

          if [ ! -f "$DIRETORIO/version.json" ]; then
            echo "ERRO: version.json não encontrado!"
            exit 1
          fi

          echo "version.json encontrado."

          echo "===== VALIDANDO DEPENDÊNCIAS ====="

          if [ ! -d "$DIRETORIO/_internal" ]; then
            echo "ERRO: Pasta _internal não encontrada!"
            ls -lah "$DIRETORIO"
            exit 1
          fi

          echo "Dependências encontradas."
          echo "Compilação Linux validada com sucesso!"

      - name: Preparar AppImage
        run: |
          mkdir -p AppDir/usr/bin

          cp -r dist/PDV-Mercadinho AppDir/usr/bin/

          cp assets/pdv-mercadinho.png AppDir/pdv-mercadinho.png
          cp assets/pdv-mercadinho.png AppDir/.DirIcon

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          cd "$HERE/usr/bin/PDV-Mercadinho"
          exec ./PDV-Mercadinho "$@"
          EOF

          chmod +x AppDir/AppRun

          cat > AppDir/pdv-mercadinho.desktop <<'EOF'
          [Desktop Entry]
          Name=PDV Mercadinho
          Exec=AppRun
          Icon=pdv-mercadinho
          Type=Application
          Categories=Office;
          Terminal=false
          EOF

      - name: Baixar ferramenta AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Gerar AppImage
        run: |
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
          ./appimagetool-x86_64.AppImage \
          AppDir dist/PDV-Mercadinho-Linux.AppImage

      - name: Validar AppImage
        run: |
          if [ ! -s dist/PDV-Mercadinho-Linux.AppImage ]; then
            echo "ERRO: AppImage não foi gerado!"
            exit 1
          fi

          echo "AppImage gerado com sucesso."

      - name: Salvar pacote Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/PDV-Mercadinho-Linux.AppImage
          if-no-files-found: error


  # ==========================================
  # PUBLICAR RELEASE
  # ==========================================

  publish:
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux

    steps:
      - name: Baixar arquivos Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Baixar arquivos Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - name: Conferir arquivos da Release
        run: |
          test -s release-assets/PDV-Mercadinho-Windows.zip
          test -s release-assets/PDV-Mercadinho-Linux.AppImage

          echo "Arquivos preparados para publicação:"
          ls -lh release-assets/

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            release-assets/PDV-Mercadinho-Windows.zip
            release-assets/PDV-Mercadinho-Linux.AppImage
          generate_release_notes: true
          make_latest: true
