
name: Gerar versões do PDV

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Windows
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name PDV-Mercadinho main.py

      - name: Compactar executável
        run: |
          Compress-Archive -Path dist/PDV-Mercadinho -DestinationPath PDV-Mercadinho-Windows.zip

      - name: Armazenar executável
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Windows
          path: PDV-Mercadinho-Windows.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Linux
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name PDV-Mercadinho main.py

      - name: Armazenar executável
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Linux
          path: dist/PDV-Mercadinho/
